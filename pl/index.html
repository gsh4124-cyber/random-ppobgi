<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Losowanie Imion i Generator Liczb Losowych</title><meta name="description" content="Darmowe losowanie imion, opcji i liczb. Bez rejestracji."><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/pl/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body data-empty-message="Dodaj co najmniej jedną opcję." data-range-message="Sprawdź zakres liczb."><h1>Losowanie</h1><p>Wylosuj imię, opcję lub liczbę za darmo.</p><section class="card"><h2>Losowanie imion / opcji</h2><textarea id="globalList" placeholder="Anna&#10;Piotr&#10;Marta"></textarea><button id="globalPickList">Wylosuj</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>Losowa liczba</h2><div class="row"><input id="globalMin" type="number" value="1"><input id="globalMax" type="number" value="100"></div><button id="globalPickNumber">Generuj</button><div class="result" id="globalNumberResult"></div></section><script src="../global-basic.js"></script></body></html>
