<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorteador aleatório · Nomes e números</title><meta name="description" content="Sorteador gratuito para nomes, opções e números. Cole uma lista e escolha um item aleatoriamente ou gere um número em qualquer intervalo."><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/pt/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.langs a{margin-right:10px}</style></head><body data-empty-message="Adicione pelo menos uma opção." data-range-message="Confira o intervalo numérico."><h1>Sorteador aleatório</h1><p>Sorteie gratuitamente um nome, uma opção ou um número, sem cadastro.</p><section class="card"><h2>Sorteador de nomes / opções</h2><textarea id="globalList" placeholder="Ana&#10;Lucas&#10;Marina"></textarea><button id="globalPickList">Sortear</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>Gerador de números aleatórios</h2><div class="row"><input id="globalMin" type="number" value="1" aria-label="Mínimo"><input id="globalMax" type="number" value="100" aria-label="Máximo"></div><button id="globalPickNumber">Gerar número</button><div class="result" id="globalNumberResult"></div></section><p class="langs"><a href="../en/">English</a><a href="../ja/">日本語</a><a href="../es/">Español</a><a href="../zh/">
