<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机抽签 · 名字选择器与随机数生成器</title><meta name="description" content="免费随机选择名字、选项或数字。粘贴列表即可随机抽取，也可生成指定范围内的随机数。"><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/zh/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.langs a{margin-right:10px}</style></head><body data-empty-message="请至少输入一个选项。" data-range-message="请检查数字范围。"><h1>随机抽签</h1><p>免费随机选择名字、选项或数字，无需注册。</p><section class="card"><h2>名字 / 选项随机选择</h2><textarea id="globalList" placeholder="小明&#10;小红&#10;小李"></textarea><button id="globalPickList">随机选择</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>随机数生成器</h2><div class="row"><input id="globalMin" type="number" value="1" aria-label="最小值"><input id="globalMax" type="number" value="100" aria-label="最大值"></div><button id="globalPickNumber">生成数字</button><div class="result" id="globalNumberResult"></div></section><p class="langs"><a href="../en/">English</a><a href="../ja/">日本語</a><a href="../es/">Español</a><a href="../fr/">Français</a><a href="../de/">Deutsch</a><a href="../pt/">Português</a></p><script src="../global-basic.js"></script></body></html>
