<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختيار أسماء وأرقام عشوائية مجاناً</title><meta name="description" content="اختر اسماً أو خياراً أو رقماً عشوائياً مجاناً وفوراً. بدون تسجيل."><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/ar/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body data-empty-message="أضف خياراً واحداً على الأقل." data-range-message="تحقق من نطاق الأرقام."><h1>اختيار عشوائي</h1><p>اختر اسماً أو خياراً أو رقماً عشوائياً فوراً.</p><section class="card"><h2>الأسماء / الخيارات</h2><textarea id="globalList" placeholder="أحمد&#10;سارة&#10;علي"></textarea><button id="globalPickList">اختر واحداً</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>رقم عشوائي</h2><div class="row"><input id="globalMin" type="number" value="1"><input id="globalMax" type="number" value="100"></div><button id="globalPickNumber">إنشاء رقم</button><div class="result" id="globalNumberResult"></div></section><script src="../global-basic.js"></script></body></html>
