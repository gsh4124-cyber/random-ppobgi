<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สุ่มชื่อและสุ่มตัวเลขฟรี</title><meta name="description" content="สุ่มชื่อ ตัวเลือก หรือตัวเลขได้ฟรีทันที ไม่ต้องสมัครสมาชิก"><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/th/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body data-empty-message="กรุณาเพิ่มอย่างน้อยหนึ่งตัวเลือก" data-range-message="กรุณาตรวจสอบช่วงตัวเลข"><h1>สุ่มตัวเลือก</h1><p>สุ่มชื่อ ตัวเลือก หรือตัวเลขได้ทันที</p><section class="card"><h2>สุ่มชื่อ / ตัวเลือก</h2><textarea id="globalList" placeholder="Anna&#10;Beam&#10;Chai"></textarea><button id="globalPickList">สุ่มหนึ่งรายการ</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>สุ่มตัวเลข</h2><div class="row"><input id="globalMin" type="number" value="1"><input id="globalMax" type="number" value="100"></div><button id="globalPickNumber">สร้างตัวเลข</button><div class="result" id="globalNumberResult"></div></section><script src="../global-basic.js"></script></body></html>
