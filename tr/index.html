<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastgele İsim Seçici ve Sayı Üretici</title><meta name="description" content="İsim, seçenek veya sayıyı ücretsiz ve rastgele seçin. Kayıt gerekmez."><meta name="robots" content="index,follow"><link rel="canonical" href="https://random-ppobgi.pages.dev/tr/"><style>body{font-family:system-ui,sans-serif;max-width:700px;margin:auto;padding:42px 20px;background:#f4f0e8;color:#211d18}.card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:22px;padding:22px;margin:18px 0}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c3;border-radius:12px;font:inherit}textarea{min-height:130px}button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#24211d;color:#fff;font-weight:700}.result{font-size:1.5rem;font-weight:800;min-height:2rem;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body data-empty-message="En az bir seçenek ekleyin." data-range-message="Sayı aralığını kontrol edin."><h1>Rastgele Seçici</h1><p>İsim, seçenek veya sayıyı anında rastgele seçin.</p><section class="card"><h2>İsim / Seçenek</h2><textarea id="globalList" placeholder="Ayşe&#10;Mehmet&#10;Elif"></textarea><button id="globalPickList">Birini seç</button><div class="result" id="globalListResult"></div></section><section class="card"><h2>Rastgele sayı</h2><div class="row"><input id="globalMin" type="number" value="1"><input id="globalMax" type="number" value="100"></div><button id="globalPickNumber">Sayı üret</button><div class="result" id="globalNumberResult"></div></section><script src="../global-basic.js"></script></body></html>
