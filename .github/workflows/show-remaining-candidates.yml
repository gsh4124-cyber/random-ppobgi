name: One-off remaining candidates UI

on:
  push:
    paths:
      - '.github/workflows/show-remaining-candidates.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show remaining candidates after exclusions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.exclude.hidden{display:none}.pinball-result{line-height:1.45}',
                  '.exclude.hidden{display:none}.remaining-candidates{margin:12px 0 2px;padding:12px 13px;border:1px solid rgba(84,67,49,.10);border-radius:16px;background:rgba(255,255,255,.66)}.remaining-candidates.hidden{display:none}.remaining-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:12px;font-weight:900;color:#6e6256}.remaining-head strong{font-size:15px;color:#2c251f}.remaining-list{display:flex;flex-wrap:wrap;gap:6px;max-height:104px;overflow:auto}.remaining-chip{display:inline-flex;align-items:center;min-height:32px;padding:6px 9px;border-radius:999px;background:#f3ede4;border:1px solid rgba(84,67,49,.08);font-size:12px;font-weight:850;color:#40362d}.pinball-result{line-height:1.45}'
              ),
              (
                  '<div class="hint" id="hint"></div><div class="all-results-row">',
                  '<div class="hint" id="hint"></div><div class="remaining-candidates hidden" id="remainingCandidates" aria-live="polite"><div class="remaining-head"><span>현재 남은 후보</span><strong id="remainingCount"></strong></div><div class="remaining-list" id="remainingList"></div></div><div class="all-results-row">'
              ),
              (
                  "bombSeconds=$('bombSeconds'),soundToggle=$('soundToggle');",
                  "bombSeconds=$('bombSeconds'),soundToggle=$('soundToggle'),remainingCandidates=$('remainingCandidates'),remainingCount=$('remainingCount'),remainingList=$('remainingList');"
              ),
              (
                  "function markGameComplete(){if(currentRunCompleted||!currentRunAnalytics)return;currentRunCompleted=true;trackEvent('game_complete')}",
                  "function markGameComplete(){if(currentRunCompleted||!currentRunAnalytics)return;currentRunCompleted=true;trackEvent('game_complete')}function renderRemainingCandidates(pool){const visible=excluded.size>0&&method!=='bomb';remainingCandidates.classList.toggle('hidden',!visible);if(!visible){remainingCount.textContent='';remainingList.innerHTML='';return}remainingCount.textContent=`${pool.length}명`;remainingList.innerHTML=pool.map(v=>`<span class=\"remaining-chip\">${esc(label(v))}</span>`).join('')}"
              ),
              (
                  "function resetStage(){animationToken++;cancelAllAsync();revealAllHandler=null;showingAll=false;visual.innerHTML='';interactiveControls.innerHTML='';hint.textContent='';stageStatus.textContent='';showAllBtn.hidden=false;resultBlock.classList.remove('show');stage.classList.remove('show');toast.classList.remove('show');mainCard.classList.remove('shake')}",
                  "function resetStage(){animationToken++;cancelAllAsync();revealAllHandler=null;showingAll=false;visual.innerHTML='';interactiveControls.innerHTML='';hint.textContent='';stageStatus.textContent='';showAllBtn.hidden=false;remainingCandidates.classList.add('hidden');remainingCount.textContent='';remainingList.innerHTML='';resultBlock.classList.remove('show');stage.classList.remove('show');toast.classList.remove('show');mainCard.classList.remove('shake')}"
              ),
              (
                  "let pool=profile.needsInput?items():[];if(useExclusions)pool=pool.filter(v=>!excluded.has(v.id));resultMode=resultModeEl.value;",
                  "let pool=profile.needsInput?items():[];if(useExclusions)pool=pool.filter(v=>!excluded.has(v.id));renderRemainingCandidates(pool);resultMode=resultModeEl.value;"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source text not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          status_path = Path('PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          note = '- 2026-09-01 누적 제외 재뽑기 시 추첨 화면에 `현재 남은 후보 N명`과 실제 남은 후보 목록을 표시하도록 개선. 제외할 때마다 숫자와 목록이 줄고, `전체에서 다시 뽑기` 시 원래 전체 후보로 복구됨.\n'
          marker = '## 현재 병목'
          if note.strip() not in status:
              if marker not in status:
                  raise SystemExit('PROJECT_STATUS insertion marker not found')
              status = status.replace(marker, note + '\n' + marker, 1)
              status_path.write_text(status, encoding='utf-8')
          PY

      - name: Static and regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'id="remainingCandidates"' in text
          assert 'id="remainingCount"' in text
          assert 'id="remainingList"' in text
          assert 'function renderRemainingCandidates(pool)' in text
          assert "if(useExclusions)pool=pool.filter(v=>!excluded.has(v.id));renderRemainingCandidates(pool);" in text
          assert "$('repickBtn').addEventListener('click',()=>{excluded.clear();run(false,'reroll')})" in text
          assert "lastWinners.forEach(v=>excluded.add(v.id));run(true,'exclude_reroll')" in text
          print('remaining candidates static QA passed')
          PY
          node --test tests/*.test.mjs

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html PROJECT_STATUS.md; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_STATUS.md
          git commit -m 'Show remaining candidates after exclusion rerolls'
          git push
