name: Fix i18n residuals

on:
  push:
    paths:
      - '.github/workflows/fix-i18n-residuals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch final visible residuals and browser QA
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p=Path('i18n-v2.js')
          s=p.read_text(encoding='utf-8')

          anchor="set('#bombModeRandom',pack.random);set('#bombModeFixed',pack.setTime);"
          replacement="set('#bombModeRandom',pack.random);set('#bombModeFixed',pack.setTime);const bombUnit=q('#bombSeconds')?.parentElement?.querySelector('.unit');if(bombUnit)bombUnit.textContent='s';"
          if anchor not in s: raise SystemExit('bomb unit anchor missing')
          if "bombUnit.textContent='s'" not in s: s=s.replace(anchor,replacement,1)

          anchor2="attr('#resultMode','aria-label',pack.result);attr('#customResults','placeholder',pack.customPlaceholder);set('#customResultNote',pack.customNote);"
          replacement2="attr('#resultMode','aria-label',pack.result);attr('#customResults','placeholder',pack.customPlaceholder);set('label[for=\"customResults\"]',pack.custom);set('#customResultNote',pack.customNote);"
          if anchor2 not in s: raise SystemExit('custom result label anchor missing')
          if "label[for=\"customResults\"]',pack.custom" not in s: s=s.replace(anchor2,replacement2,1)

          p.write_text(s,encoding='utf-8')

          t=Path('tests/i18n-browser-smoke.mjs')
          x=t.read_text(encoding='utf-8')
          helper="""async function visibleTextWithoutLanguageSwitch(page) {\n  return page.evaluate(() => {\n    const el=document.getElementById('languageSwitch');\n    const previous=el?.style.display ?? '';\n    if(el) el.style.display='none';\n    const text=document.body.innerText;\n    if(el) el.style.display=previous;\n    return text;\n  });\n}\n"""
          if 'async function visibleTextWithoutLanguageSwitch' not in x:
            marker='async function waitReady(page) {'
            if marker not in x: raise SystemExit('waitReady marker missing')
            x=x.replace(marker,helper+'\n'+marker,1)

          import re
          x=re.sub(r"await page\.evaluate\(\(\) => \{ const clone=document\.body\.cloneNode\(true\); clone\.querySelector\('#languageSwitch'\)\?\.remove\(\); return clone\.innerText; \}\)","await visibleTextWithoutLanguageSwitch(page)",x)
          t.write_text(x,encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check i18n-v2.js
          node --check tests/i18n-browser-smoke.mjs

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i18n-v2.js tests/i18n-browser-smoke.mjs
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Finish visible multilingual localization fixes'
          git push
