name: Fix i18n residuals

on:
  push:
    paths:
      - '.github/workflows/fix-i18n-residuals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dynamic game titles
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('i18n-v2.js')
          s=p.read_text(encoding='utf-8')
          anchor="""    let x=s;\n    x=x.replace(/(\\d+)명\\s*도착/g,(_,n)=>`${compactCount(n)} ${pack.dynamic.arrived}`);"""
          replacement="""    let x=s;\n    const methodWords={사다리:pack.methods.ladder,룰렛:pack.methods.wheel,제비:pack.methods.lot,핀볼:pack.methods.pinball,경주:pack.methods.race,캡슐:pack.methods.capsule,슬롯:pack.methods.slot,폭탄:pack.methods.bomb};\n    for(const [ko,value] of Object.entries(methodWords))x=x.split(ko).join(value);\n    x=x.replace(/(\\d+)명\\s*도착/g,(_,n)=>`${compactCount(n)} ${pack.dynamic.arrived}`);"""
          if anchor not in s: raise SystemExit('translation anchor missing')
          if 'const methodWords=' not in s: s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check i18n-v2.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i18n-v2.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Localize dynamic picker game titles'
          git push
