name: One-off reroll actions fix

on:
  push:
    paths:
      - '.github/workflows/fix-reroll-actions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reroll UX fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '<button class="again" id="repickBtn" type="button">다시 뽑기</button><button class="exclude" id="excludeBtn" type="button">당첨 제외하고 다시</button>',
                  '<button class="again" id="repickBtn" type="button">전체에서 다시 뽑기</button><button class="exclude" id="excludeBtn" type="button">당첨자 제외하고 다시 뽑기</button>'
              ),
              (
                  "resultKicker.textContent='전체 결과';excludeBtn.classList.add('hidden');return",
                  "resultKicker.textContent='전체 결과';excludeBtn.classList.toggle('hidden',resultMode!=='winner');return"
              ),
              (
                  '결과 화면의 다시 뽑기 또는 당첨 제외 후 다시 뽑기를 사용할 수 있습니다.',
                  '결과 화면의 전체에서 다시 뽑기 또는 당첨자 제외하고 다시 뽑기를 사용할 수 있습니다.'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source text not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          status_path = Path('PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          note = '''## 최근 UX 수정\n\n- 2026-09-01 재뽑기 버튼 의미를 명확히 분리: `전체에서 다시 뽑기` / `당첨자 제외하고 다시 뽑기`\n- `바로 결과 보기`로 전체 결과를 펼친 뒤에도 당첨 모드에서는 `당첨자 제외하고 다시 뽑기`를 사용할 수 있도록 수정\n- 등수·직접입력 결과에서는 기존처럼 제외 재뽑기를 노출하지 않음\n- 일반 재뽑기는 전체 참가자를 다시 후보에 넣는 기존 무작위 동작을 유지\n'''
          if '바로 결과 보기`로 전체 결과를 펼친 뒤에도' not in status:
              marker = '## 현재 병목'
              if marker not in status:
                  raise SystemExit('PROJECT_STATUS insertion marker not found')
              status = status.replace(marker, note + '\n' + marker, 1)
              status_path.write_text(status, encoding='utf-8')
          PY

      - name: Static and regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '>전체에서 다시 뽑기</button>' in text
          assert '>당첨자 제외하고 다시 뽑기</button>' in text
          assert "resultKicker.textContent='전체 결과';excludeBtn.classList.toggle('hidden',resultMode!=='winner');return" in text
          assert "$('repickBtn').addEventListener('click',()=>{excluded.clear();run(false,'reroll')})" in text
          assert "lastWinners.forEach(v=>excluded.add(v.id));run(true,'exclude_reroll')" in text
          print('reroll action static QA passed')
          PY
          node --test tests/*.test.mjs

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html PROJECT_STATUS.md; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_STATUS.md
          git commit -m 'Fix reroll actions after full results'
          git push
