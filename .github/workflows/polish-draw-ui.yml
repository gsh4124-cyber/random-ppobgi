name: One-off draw UI polish

on:
  push:
    paths:
      - '.github/workflows/polish-draw-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified draw UI polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* v51 unified draw stage shell */'
          if marker not in text:
              css = r'''

/* v51 unified draw stage shell */
#numberMode .result-note{margin-top:8px!important;margin-bottom:16px!important}
.stage,
.stage.theme-ladder,.stage.theme-wheel,.stage.theme-lot,.stage.theme-pinball,
.stage.theme-race,.stage.theme-capsule,.stage.theme-slot,.stage.theme-bomb{
  background:#fffdf8!important;
  color:#29231d!important;
  border:1px solid rgba(226,219,208,.96)!important;
  border-radius:30px!important;
  padding:14px!important;
  box-shadow:0 16px 44px rgba(48,40,29,.09)!important;
}
.stage::before,.stage.theme-ladder::before,.stage.theme-wheel::before,.stage.theme-lot::before,
.stage.theme-pinball::before,.stage.theme-race::before,.stage.theme-capsule::before,
.stage.theme-slot::before,.stage.theme-bomb::before{display:none!important}
.stage-head{margin:0 2px 12px!important;padding:2px 2px 0!important;min-height:28px}
.stage-head strong,
.stage.theme-ladder .stage-head strong,.stage.theme-wheel .stage-head strong,.stage.theme-lot .stage-head strong,
.stage.theme-pinball .stage-head strong,.stage.theme-race .stage-head strong,.stage.theme-capsule .stage-head strong,
.stage.theme-slot .stage-head strong,.stage.theme-bomb .stage-head strong{
  max-width:none!important;background:transparent!important;border:0!important;padding:0!important;
  color:#29231d!important;font-size:14px!important;font-weight:950!important;letter-spacing:-.2px!important;
}
.stage-status,.stage[class*="theme-"] .stage-status{color:#94887a!important;font-size:12px!important;font-weight:850!important}
.visual{
  width:100%!important;min-height:300px!important;padding:14px!important;
  background:#f7f3ec!important;border:1px solid #e8e0d5!important;border-radius:22px!important;
  overflow:hidden!important;
}
.game-controls{margin-top:12px!important;gap:9px!important}
.game-controls .control-main,
.stage.theme-ladder .control-main,.stage.theme-wheel .control-main,.stage.theme-lot .control-main,
.stage.theme-pinball .control-main,.stage.theme-race .control-main,.stage.theme-capsule .control-main,
.stage.theme-slot .control-main,.stage.theme-bomb .control-main{
  background:#24211d!important;color:#fff!important;border:1px solid #24211d!important;
  box-shadow:0 8px 18px rgba(36,33,29,.12)!important;
}
.game-controls .control-alt,
.stage.theme-ladder .control-alt,.stage.theme-wheel .control-alt,.stage.theme-lot .control-alt,
.stage.theme-pinball .control-alt,.stage.theme-race .control-alt,.stage.theme-capsule .control-alt,
.stage.theme-slot .control-alt,.stage.theme-bomb .control-alt{
  background:#fffdf8!important;color:#4b4137!important;border:1px solid #ded5c8!important;box-shadow:none!important;
}
.hint,.stage[class*="theme-"] .hint{margin:9px 4px 0!important;color:#8d8174!important;font-size:11px!important;font-weight:750!important}
.all-results-row{margin-top:10px!important}
.all-results-btn{min-height:42px!important;padding:10px 15px!important;background:transparent!important;border:1px solid #ded5c8!important;color:#655a4f!important;box-shadow:none!important}
.remaining-candidates{margin:12px 0 0!important;background:#faf7f1!important;border-color:#e5ddd1!important;box-shadow:none!important}
.result-block{border:0!important;margin-top:14px!important;padding:16px!important;background:#f7f3ec!important;border-radius:22px!important}
.result-kicker{margin-bottom:12px!important;color:#786d61!important;font-size:12px!important;font-weight:900!important}
.result-block .winners{margin-bottom:15px!important}
.result-block .winner{color:#211d18!important}
.stage .result-outcome{background:#e9e0d4!important;color:#2a241e!important;box-shadow:none!important}
.actions{gap:9px!important}
.actions .again{background:#fffdf8!important;border:1px solid #ded5c8!important;color:#493f35!important;box-shadow:none!important}
.actions .exclude{background:#24211d!important;border:1px solid #24211d!important;color:#fff!important;box-shadow:0 8px 18px rgba(36,33,29,.10)!important}
.round-result,.race-result,.capsule-result,.slot-result,.bomb-result,.pinball-result,.ladder-message{color:#2c251f!important}
@media(max-width:500px){
  #numberMode .result-note{margin-bottom:14px!important}
  .stage,.stage[class*="theme-"]{padding:10px!important;border-radius:22px!important}
  .stage-head{margin-bottom:9px!important;padding:1px 2px 0!important}
  .visual{min-height:248px!important;padding:9px!important;border-radius:17px!important}
  .result-block{padding:13px!important;border-radius:17px!important}
  .actions{grid-template-columns:1fr!important}
}
'''
              if '</style>' not in text:
                  raise SystemExit('style closing tag not found')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')

          status_path = Path('PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          note = '- 2026-09-01 번호 모드 안내문과 시작 버튼 사이 여백을 보정하고, 시작 후 뽑기 화면의 카드·게임영역·버튼·결과영역을 메인 설정 화면과 같은 웜 뉴트럴 톤으로 통일. 게임 로직과 결과 알고리즘은 변경하지 않음.\n'
          status_marker = '## 현재 병목'
          if note.strip() not in status:
              if status_marker not in status:
                  raise SystemExit('PROJECT_STATUS insertion marker not found')
              status = status.replace(status_marker, note + '\n' + status_marker, 1)
              status_path.write_text(status, encoding='utf-8')
          PY

      - name: Static and regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '/* v51 unified draw stage shell */' in text
          assert '#numberMode .result-note{margin-top:8px!important;margin-bottom:16px!important}' in text
          assert '.actions .exclude{background:#24211d!important' in text
          assert "$('repickBtn').addEventListener('click',()=>{excluded.clear();run(false,'reroll')})" in text
          assert "lastWinners.forEach(v=>excluded.add(v.id));run(true,'exclude_reroll')" in text
          print('draw UI static QA passed')
          PY
          node --test tests/*.test.mjs

      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet -- index.html PROJECT_STATUS.md; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_STATUS.md
          git commit -m 'Polish random picker draw UI'
          git push
